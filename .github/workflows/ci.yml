name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    # Ubuntu 24.04 ships Qt 6.4, which is the minimum the CMakeLists asks for.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            qt6-base-dev qt6-multimedia-dev libgl1-mesa-dev \
            zlib1g-dev libgtest-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      # tests/main.cpp defaults QT_QPA_PLATFORM to "offscreen", so no X server is needed.
      - name: Test
        run: ctest --test-dir build --output-on-failure
